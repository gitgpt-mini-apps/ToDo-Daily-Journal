function diaryPage(){let start=s.startDate||new Date().toISOString().slice(0,10),now=new Date(),today=now.toISOString().slice(0,10),tomorrow=new Date(now.getTime()+864e5).toISOString().slice(0,10),days=[];const last=new Date(`${s.diaryYear}-${String(s.diaryMonth+1).padStart(2,'0')}-01`);let limit=new Date(last.getFullYear(),last.getMonth()+1,0);for(let d=new Date(Math.max(new Date(start+'T00:00:00'),new Date(s.diaryYear,s.diaryMonth,1)));d<=limit;d.setDate(d.getDate()+1)){let key=d.toISOString().slice(0,10),snapshot=s.journals.find(j=>j.date===key);if(snapshot||key===today||key===tomorrow)days.push({key,snapshot})}let groups=s.categories.map(c=>`<div class="category-block"><h4>${esc(c.name)}</h4>${filtered().filter(t=>t.categoryId===c.id&&todoDate(t)).slice(0,4).map(t=>mini(t)).join('')||'<span class="help">表示する予定はありません</span>'}</div>`).join('');let archives=days.map(({key,snapshot})=>{let ts=snapshot?snapshot.todos:filtered().filter(t=>todoDate(t)===key);return `<section class="diaryday"><header>${dstr(key)}${snapshot?'<span class="tag">固定済み</span>':`<button class="archive" data-archive="${key}" ${key>=today?'disabled':''}>日報を固定</button>`}</header>${s.categories.map(c=>{let list=ts.filter(t=>t.categoryId===c.id);return list.length?`<div class="category-block"><h4>${esc(c.name)}</h4>${list.map(t=>mini(t)).join('')}</div>`:''}).join('')||'<span class="help">この日のToDoはありません</span>'}${snapshot?.note?`<div class="note">${esc(snapshot.note)}</div>`:''}</section>`}).join('');$('#app').innerHTML=`<div class="section-title"><h2>日報</h2><span>ToDoを日報として固定して履歴に残します</span></div><div class="diary-layout"><aside class="diary-side"><h3>カテゴリ別 ToDo</h3>${groups||'<span class="help">カテゴリを登録してください</span>'}<button class="btn" id="diaryAdd">＋ ToDoを追加</button></aside><section class="diary-main"><h3>${s.diaryYear}年${s.diaryMonth+1}月の記録</h3>${archives||'<div class="empty">この月の履歴はありません</div>'}</section></div>`;$('#diaryAdd').onclick=()=>todoModal()}

function headerContext(){let el=$('#context');if(s.tab==='todo')el.innerHTML='<div class="period"><button data-year="-1" aria-label="前年">‹</button><strong>'+s.todoYear+'年</strong><button data-year="1" aria-label="翌年">›</button></div>';else if(s.tab==='views')el.innerHTML=monthStrip(s.year+'-'+String(s.month+1).padStart(2,'0'),'views');else if(s.tab==='diary')el.innerHTML=monthStrip(s.diaryYear+'-'+String(s.diaryMonth+1).padStart(2,'0'),'diary');else el.innerHTML=''}
document.addEventListener('click',e=>{let b=e.target.closest('[data-set-month]');if(b){let [y,m]=b.dataset.setMonth.split('-').map(Number);if(b.dataset.scope==='views'){s.year=y;s.month=m-1}else{s.diaryYear=y;s.diaryMonth=m-1}save();render();requestAnimationFrame(()=>document.querySelector('.month-options [data-set-month="'+b.dataset.setMonth+'"]')?.scrollIntoView({inline:'center',block:'nearest'}))}b=e.target.closest('[data-scroll-months]');if(b)$('#monthOptions')?.scrollBy({left:Number(b.dataset.scrollMonths)*240,behavior:'smooth'})});

function availableTodoYears(selected,scope){let years=[...new Set(s.todos.filter(t=>s.selectedCategory==='all'||t.categoryId===s.selectedCategory).map(todoDate).filter(Boolean).map(d=>d.slice(0,4)))].sort();if(!years.length)return [String(selected)];if(!years.includes(String(selected))){selected=Number(years[years.length-1]);if(scope==='todo')s.todoYear=selected;else s.year=selected;save()}return years}
function yearStrip(selected,scope){return '<div class="year-strip"><button class="year-edge" data-scroll-years="-1" aria-label="前の年">‹</button><div class="year-options" id="yearOptions">'+availableTodoYears(selected,scope).map(y=>'<button data-set-year="'+y+'" data-scope="'+scope+'" class="'+(String(selected)===y?'active':'')+'">'+y+'</button>').join('')+'</div><button class="year-edge" data-scroll-years="1" aria-label="次の年">›</button></div>'}
function headerContext(){let el=$('#context');if(s.tab==='todo')el.innerHTML=yearStrip(s.todoYear,'todo');else if(s.tab==='views'&&s.activeView==='year')el.innerHTML=yearStrip(s.year,'views');else if(s.tab==='views')el.innerHTML=monthStrip(s.year+'-'+String(s.month+1).padStart(2,'0'),'views');else if(s.tab==='diary')el.innerHTML=monthStrip(s.diaryYear+'-'+String(s.diaryMonth+1).padStart(2,'0'),'diary');else el.innerHTML=''}
document.addEventListener('click',e=>{let b=e.target.closest('[data-set-year]');if(b){let y=Number(b.dataset.setYear);if(b.dataset.scope==='todo')s.todoYear=y;else s.year=y;save();render();requestAnimationFrame(()=>document.querySelector('.year-options [data-set-year="'+y+'"]')?.scrollIntoView({inline:'center',block:'nearest'}))}b=e.target.closest('[data-scroll-years]');if(b)$('#yearOptions')?.scrollBy({left:Number(b.dataset.scrollYears)*220,behavior:'smooth'})});

const SORT_FIELDS={category:'カテゴリ',type:'タイプ',label:'ラベル',status:'ステータス',date:'日時'};
function sortTodoItems(items,settings={}){let key=settings.sortBy||'date',dir=settings.sortDir==='desc'?-1:1;return [...items].sort((a,b)=>{let av,bv;if(key==='category'){av=cat(a.categoryId)?.name||'';bv=cat(b.categoryId)?.name||''}else if(key==='type'){av=a.type||'';bv=b.type||''}else if(key==='label'){av=a.label||'';bv=b.label||''}else if(key==='status'){av=Math.max(0,STATUSES.indexOf(a.status));bv=Math.max(0,STATUSES.indexOf(b.status));return (av-bv)*dir} else {av=(todoDate(a)||'')+' '+(a.time||'');bv=(todoDate(b)||'')+' '+(b.time||'')}return String(av).localeCompare(String(bv),'ja',{numeric:true})*dir||String(a.content||'').localeCompare(String(b.content||''),'ja')})}
function filtered(){let list=s.todos;if(s.selectedCategory!=='all')list=list.filter(t=>t.categoryId===s.selectedCategory);if(s.tab==='todo'||s.tab==='views'){let f=getCurrentModeFilter();if(s.selectedCategory!=='all')list=list.filter(t=>t.categoryId===s.selectedCategory);else if(f.categories?.length)list=list.filter(t=>f.categories.includes(t.categoryId));if(f.types?.length)list=list.filter(t=>f.types.includes(t.type));if(f.labels?.length)list=list.filter(t=>f.labels.includes(t.label));if(s.tab==='views')list=sortTodoItems(list,f)}return list}
function editModeFilters(){let ctx=modeFilterContext(),scope=s.selectedCategory,catItems=scope==='all'?s.categories:[cat(scope)].filter(Boolean),f=getCurrentModeFilter(),labels=[...new Set(catItems.flatMap(c=>c.labels||[]))],title=ctx==='todo'?'ToDo':(MODE_LABELS[ctx]||s.views.find(v=>v.id===ctx)?.name||'表示モード');const check=(group,val,label,checked)=>'<label class="filter-choice"><input type="checkbox" data-filter="'+group+'" value="'+esc(val)+'" '+(checked?'checked':'')+'> '+esc(label)+'</label>';let sortControls=ctx==='todo'?'':'<details class="setting-fold"><summary>並び替え</summary><div class="field"><label>項目</label><select id="filterSortBy">'+Object.entries(SORT_FIELDS).map(([k,v])=>'<option value="'+k+'" '+((f.sortBy||'date')===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field" style="margin-top:8px"><label>順序</label><select id="filterSortDir"><option value="asc" '+((f.sortDir||'asc')==='asc'?'selected':'')+'>昇順</option><option value="desc" '+(f.sortDir==='desc'?'selected':'')+'>降順</option></select></div></details>';modal('<h2>検索条件 · '+esc(title)+'</h2><p class="help">このカテゴリと画面だけに保存します。条件未指定はすべて表示です。</p><details class="setting-fold" open><summary>カテゴリ</summary>'+(scope==='all'?'<div class="settings-list">'+s.categories.map(c=>check('categories',c.id,c.name,!f.categories?.length||f.categories.includes(c.id))).join('')+'</div>':'<p class="help">「'+esc(cat(scope)?.name||'選択カテゴリ')+'」に固定しています。</p>')+'</details><details class="setting-fold"><summary>タイプ</summary><div class="settings-list">'+TYPES.map(x=>check('types',x,x,!f.types?.length||f.types.includes(x))).join('')+'</div></details><details class="setting-fold"><summary>ラベル</summary><div class="settings-list">'+labels.map(x=>check('labels',x,x,!f.labels?.length||f.labels.includes(x))).join('')+'</div></details>'+sortControls+'<div class="modal-actions"><button type="button" class="btn" id="resetModeFilters">すべて表示</button><div class="actions-right"><button type="button" class="btn" data-close>キャンセル</button><button type="button" class="btn primary" id="saveModeFilters">保存</button></div></div>');$('#resetModeFilters').onclick=()=>{s.modeFilters[scope]=s.modeFilters[scope]||{};s.modeFilters[scope][ctx]={categories:[],types:[],labels:[],sortBy:'date',sortDir:'asc'};save();$('#overlay').innerHTML='';render()};$('#saveModeFilters').onclick=()=>{let next={};for(let key of ['categories','types','labels']){if(key==='categories'&&scope!=='all'){next.categories=[scope];continue}let selected=[...document.querySelectorAll('[data-filter="'+key+'"]:checked')].map(x=>x.value),total=key==='categories'?s.categories.length:key==='types'?TYPES.length:labels.length;next[key]=selected.length===total?[]:selected}if(ctx!=='todo'){next.sortBy=$('#filterSortBy').value;next.sortDir=$('#filterSortDir').value}else{next.sortBy=f.sortBy||'date';next.sortDir=f.sortDir||'asc'}s.modeFilters[scope]=s.modeFilters[scope]||{};s.modeFilters[scope][ctx]=next;save();$('#overlay').innerHTML='';render()}}
function monthEvents(y,m){return sortTodoItems(filtered().filter(t=>todoDate(t).startsWith(y+'-'+String(m+1).padStart(2,'0'))),getCurrentModeFilter())}
function todoPage(){s.todoSort=s.todoSort||{by:'date',dir:'desc'};let ts=filtered().filter(t=>todoDate(t).startsWith(String(s.todoYear))).sort((a,b)=>todoDate(b).localeCompare(todoDate(a)));ts=sortTodoItems(ts,s.todoSort);$('#app').innerHTML='<div class="section-title"><h2>ToDo</h2><span id="todoCount">'+ts.length+'件</span><button class="btn" id="todoFilters">＋ カスタム</button></div><div class="todo-tools"><input id="todoSearch" type="search" placeholder="内容を検索" value="'+esc(s.todoSearch||'')+'"><label>並び替え <select id="todoSortBy">'+Object.entries(SORT_FIELDS).map(([k,v])=>'<option value="'+k+'" '+(s.todoSort.by===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><button type="button" class="btn" id="todoSortDir">'+(s.todoSort.dir==='asc'?'↑ 昇順':'↓ 降順')+'</button></div>'+(ts.length?'<div class="list" id="todoList">'+ts.map(t=>card(t)).join('')+'</div><div class="empty" id="todoNoMatch" hidden>該当するToDoはありません</div>':'<div class="empty"><b>'+s.todoYear+'年のToDoはありません</b>＋ボタンから予定を登録できます</div>');$('#todoFilters').onclick=editModeFilters;let search=$('#todoSearch');const applySearch=()=>{let q=(search.value||'').trim().toLocaleLowerCase(),cards=[...document.querySelectorAll('#todoList .todo')],shown=0;cards.forEach(x=>{let title=x.querySelector('.todo-title')?.textContent.toLocaleLowerCase()||'',match=!q||title.includes(q);x.hidden=!match;if(match)shown++});$('#todoNoMatch')?.toggleAttribute('hidden',shown>0||!cards.length);$('#todoCount').textContent=q?shown+'/'+ts.length+'件':ts.length+'件'};search.oninput=()=>{s.todoSearch=search.value;save();applySearch()};$('#todoSortBy').onchange=e=>{s.todoSort.by=e.target.value;save();render()};$('#todoSortDir').onclick=()=>{s.todoSort.dir=s.todoSort.dir==='asc'?'desc':'asc';save();render()};applySearch()}

function sortTodoItems(items,settings={}){let rules=Array.isArray(settings)?settings:(settings.sorts||((settings.sortBy)?[{by:settings.sortBy,dir:settings.sortDir||'asc'}]:[]));if(!rules.length)return [...items];return [...items].sort((a,b)=>{for(let rule of rules){let av,bv,k=rule.by,dir=rule.dir==='desc'?-1:1;if(k==='category'){av=cat(a.categoryId)?.name||'';bv=cat(b.categoryId)?.name||''}else if(k==='type'){av=a.type||'';bv=b.type||''}else if(k==='label'){av=a.label||'';bv=b.label||''}else if(k==='status'){av=Math.max(0,STATUSES.indexOf(a.status));bv=Math.max(0,STATUSES.indexOf(b.status));let c=av-bv;if(c)return c*dir;continue}else{av=(todoDate(a)||'')+' '+(a.time||'');bv=(todoDate(b)||'')+' '+(b.time||'')}let c=String(av).localeCompare(String(bv),'ja',{numeric:true});if(c)return c*dir}return String(a.content||'').localeCompare(String(b.content||''),'ja')})}
function sortRulesHtml(rules,id){let used=rules.map(x=>x.by);return '<div class="sort-rules" id="'+id+'">'+rules.map((r,i)=>'<div class="sort-rule" data-rule-row="'+i+'"><span class="sort-priority">'+(i+1)+'</span><select data-rule-field="'+i+'" aria-label="並び替え項目">'+Object.entries(SORT_FIELDS).map(([k,v])=>'<option value="'+k+'" '+(r.by===k?'selected':'')+(used.includes(k)&&r.by!==k?' disabled':'')+'>'+v+'</option>').join('')+'</select><select data-rule-dir="'+i+'" aria-label="並び替え順序"><option value="asc" '+(r.dir!=='desc'?'selected':'')+'>昇順</option><option value="desc" '+(r.dir==='desc'?'selected':'')+'>降順</option></select><button type="button" data-rule-move="'+i+':-1" '+(i===0?'disabled':'')+' aria-label="優先度を上げる">↑</button><button type="button" data-rule-move="'+i+':1" '+(i===rules.length-1?'disabled':'')+' aria-label="優先度を下げる">↓</button><button type="button" data-rule-delete="'+i+'" aria-label="条件を削除">×</button></div>').join('')+'<button type="button" class="btn add-sort-rule" data-rule-add>＋ 条件を追加</button></div>'}
function bindSortRules(container,rules,onChange){if(!container)return;const refresh=()=>{container.innerHTML=sortRulesHtml(rules,container.id);bindSortRules(container,rules,onChange)};container.querySelectorAll('[data-rule-field]').forEach(x=>x.onchange=()=>{rules[+x.dataset.ruleField].by=x.value;onChange()});container.querySelectorAll('[data-rule-dir]').forEach(x=>x.onchange=()=>{rules[+x.dataset.ruleDir].dir=x.value;onChange()});container.querySelectorAll('[data-rule-move]').forEach(x=>x.onclick=()=>{let [i,d]=x.dataset.ruleMove.split(':').map(Number),j=i+d;if(j<0||j>=rules.length)return;[rules[i],rules[j]]=[rules[j],rules[i]];refresh();onChange()});container.querySelectorAll('[data-rule-delete]').forEach(x=>x.onclick=()=>{rules.splice(+x.dataset.ruleDelete,1);refresh();onChange()});container.querySelector('[data-rule-add]')?.addEventListener('click',()=>{if(rules.length>=Object.keys(SORT_FIELDS).length)return toast('並び替え条件は5項目までです');let key=Object.keys(SORT_FIELDS).find(k=>!rules.some(r=>r.by===k));rules.push({by:key||'date',dir:'asc'});refresh();onChange()})}
function editModeFilters(){let ctx=modeFilterContext(),scope=s.selectedCategory,catItems=scope==='all'?s.categories:[cat(scope)].filter(Boolean),f=getCurrentModeFilter(),labels=[...new Set(catItems.flatMap(c=>c.labels||[]))],title=ctx==='todo'?'ToDo':(MODE_LABELS[ctx]||s.views.find(v=>v.id===ctx)?.name||'表示モード'),rules=Array.isArray(f.sorts)?f.sorts.map(x=>({...x})):[{by:f.sortBy||'date',dir:f.sortDir||'asc'}];const check=(group,val,label,checked)=>'<label class="filter-choice"><input type="checkbox" data-filter="'+group+'" value="'+esc(val)+'" '+(checked?'checked':'')+'> '+esc(label)+'</label>';let sortControls=ctx==='todo'?'':'<details class="setting-fold"><summary>並び替え（上から優先）</summary>'+sortRulesHtml(rules,'filterSortRules')+'</details>';modal('<h2>検索条件 · '+esc(title)+'</h2><p class="help">このカテゴリと画面だけに保存します。条件未指定はすべて表示です。</p><details class="setting-fold" open><summary>カテゴリ</summary>'+(scope==='all'?'<div class="settings-list">'+s.categories.map(c=>check('categories',c.id,c.name,!f.categories?.length||f.categories.includes(c.id))).join('')+'</div>':'<p class="help">「'+esc(cat(scope)?.name||'選択カテゴリ')+'」に固定しています。</p>')+'</details><details class="setting-fold"><summary>タイプ</summary><div class="settings-list">'+TYPES.map(x=>check('types',x,x,!f.types?.length||f.types.includes(x))).join('')+'</div></details><details class="setting-fold"><summary>ラベル</summary><div class="settings-list">'+labels.map(x=>check('labels',x,x,!f.labels?.length||f.labels.includes(x))).join('')+'</div></details>'+sortControls+'<div class="modal-actions"><button type="button" class="btn" id="resetModeFilters">すべて表示</button><div class="actions-right"><button type="button" class="btn" data-close>キャンセル</button><button type="button" class="btn primary" id="saveModeFilters">保存</button></div></div>');bindSortRules($('#filterSortRules'),rules,()=>{});$('#resetModeFilters').onclick=()=>{s.modeFilters[scope]=s.modeFilters[scope]||{};s.modeFilters[scope][ctx]={categories:[],types:[],labels:[],sorts:[{by:'date',dir:'asc'}]};save();$('#overlay').innerHTML='';render()};$('#saveModeFilters').onclick=()=>{let next={};for(let key of ['categories','types','labels']){if(key==='categories'&&scope!=='all'){next.categories=[scope];continue}let selected=[...document.querySelectorAll('[data-filter="'+key+'"]:checked')].map(x=>x.value),total=key==='categories'?s.categories.length:key==='types'?TYPES.length:labels.length;next[key]=selected.length===total?[]:selected}if(ctx!=='todo')next.sorts=rules.map(x=>({...x}));else{next.sorts=f.sorts||[{by:f.sortBy||'date',dir:f.sortDir||'asc'}]}s.modeFilters[scope]=s.modeFilters[scope]||{};s.modeFilters[scope][ctx]=next;save();$('#overlay').innerHTML='';render()}}
function monthEvents(y,m){return sortTodoItems(filtered().filter(t=>todoDate(t).startsWith(y+'-'+String(m+1).padStart(2,'0'))),getCurrentModeFilter())}
function todoPage(){s.todoSortRules=Array.isArray(s.todoSortRules)?s.todoSortRules:(s.todoSort?[{by:s.todoSort.by||'date',dir:s.todoSort.dir||'desc'}]:[{by:'date',dir:'desc'}]);let ts=sortTodoItems(filtered().filter(t=>todoDate(t).startsWith(String(s.todoYear))),s.todoSortRules);$('#app').innerHTML='<div class="section-title"><h2>ToDo</h2><span id="todoCount">'+ts.length+'件</span><button class="btn" id="todoFilters">＋ カスタム</button></div><div class="todo-tools"><input id="todoSearch" type="search" placeholder="内容を検索" value="'+esc(s.todoSearch||'')+'"><div class="todo-sort"><strong>並び替え（上から優先）</strong>'+sortRulesHtml(s.todoSortRules,'todoSortRules')+'</div></div>'+(ts.length?'<div class="list" id="todoList">'+ts.map(t=>card(t)).join('')+'</div><div class="empty" id="todoNoMatch" hidden>該当するToDoはありません</div>':'<div class="empty"><b>'+s.todoYear+'年のToDoはありません</b>＋ボタンから予定を登録できます</div>');$('#todoFilters').onclick=editModeFilters;const search=$('#todoSearch');const applySearch=()=>{let q=(search.value||'').trim().toLocaleLowerCase(),cards=[...document.querySelectorAll('#todoList .todo')],shown=0;cards.forEach(x=>{let title=x.querySelector('.todo-title')?.textContent.toLocaleLowerCase()||'',match=!q||title.includes(q);x.hidden=!match;if(match)shown++});$('#todoNoMatch')?.toggleAttribute('hidden',shown>0||!cards.length);$('#todoCount').textContent=q?shown+'/'+ts.length+'件':ts.length+'件'};search.oninput=()=>{s.todoSearch=search.value;save();applySearch()};bindSortRules($('#todoSortRules'),s.todoSortRules,()=>{save();render()});applySearch()}
render();
})();
</script></body></html>
