<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-Bullet Journal</title>
<style>
:root{--future:#e3f2fd;--monthly:#e8f5e9;--daily:#fff3e0;--todo:#f3e5f5;--ink:#273142;--muted:#687386;--line:#d9e0e9;--paper:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,"Yu Gothic UI",sans-serif}header{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 18px;background:#243247;color:white}header h1{font-size:19px;margin:0;white-space:nowrap}.brand{display:flex;flex-direction:column;min-width:0;gap:4px}.workspace-tabs{display:flex;align-items:center;gap:5px;overflow-x:auto;min-width:0;margin:0;scrollbar-width:none}.workspace-tabs::-webkit-scrollbar{display:none}.workspace-tabs[hidden]{display:none}.workspace-tabs button{flex:none;border:1px solid #ffffff55;border-radius:16px;background:#ffffff18;color:white;padding:5px 10px;font-size:12px;white-space:nowrap;cursor:pointer}.workspace-tabs button.active{background:white;color:#243247}.icon-btn{border:0;background:transparent;color:inherit;font-size:22px;cursor:pointer}.tabs{display:flex;position:sticky;top:48px;z-index:3;background:white;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:12px 4px;border:0;background:white;font-weight:700;color:var(--muted);cursor:pointer}.tabs button.active{color:#17263b;background:#e3e9f1;border-bottom:3px solid #344a68}.bottom-tabs button{pointer-events:auto;cursor:pointer}@keyframes swipe-in-next{from{opacity:.7;transform:translateX(10%)}to{opacity:1;transform:translateX(0)}}@keyframes swipe-in-prev{from{opacity:.7;transform:translateX(-10%)}to{opacity:1;transform:translateX(0)}}.panel.swipe-in-next{animation:swipe-in-next 360ms cubic-bezier(.2,.75,.25,1)}.panel.swipe-in-prev{animation:swipe-in-prev 360ms cubic-bezier(.2,.75,.25,1)}@media(prefers-reduced-motion:reduce){.panel.swipe-in-next,.panel.swipe-in-prev{animation-duration:1ms}}.main{padding:16px;max-width:1200px;margin:auto}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:72px}.card.today{border:2px solid #365b85;box-shadow:0 0 0 3px #bfd0e4}.card.future{background:color-mix(in srgb,var(--future) 42%,white)}.card.monthly{background:color-mix(in srgb,var(--monthly) 42%,white)}.card.daily{background:color-mix(in srgb,var(--daily) 42%,white)}.card.todo{background:color-mix(in srgb,var(--todo) 42%,white)}.card-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding-bottom:7px;border-bottom:1px solid #ffffffb0}.add{border:0;background:#fff9;border-radius:7px;padding:3px 9px;font-size:18px;cursor:pointer}.entries{list-style:none;margin:8px 0 0;padding:0}.entry{display:flex;align-items:center;gap:8px;margin:5px 0;padding:7px 8px;background:#ffffffc9;border:1px solid #dce2ea;border-radius:8px;cursor:pointer}.entry .title{flex:1;overflow:hidden;text-overflow:ellipsis}.entry.daily-note{flex-wrap:wrap}.entry.daily-note .badge{margin-left:auto}.entry.due-past{background:#fff0e8;border-color:#d98a63;box-shadow:inset 3px 0 #c45a32}.entry .daily-copy{flex:none;border:1px solid var(--line);border-radius:6px;background:white;padding:3px 6px;font-size:11px;color:#34577e;cursor:pointer}.entry .note{flex:0 0 100%;font-size:13px;color:#526175;white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 4px 0}.date{font-size:12px;color:var(--muted);white-space:nowrap}.badge{font-size:11px;padding:2px 7px;background:#edf0f4;border-radius:20px;white-space:nowrap}.status-着手{background:#dcecff}.status-完了{background:#ddf2e2}.status-延期{background:#fff0c2}.status-中止{background:#ffe0e0}.footer{position:sticky;bottom:0;display:flex;align-items:center;gap:7px;overflow-x:auto;overflow-y:hidden;box-sizing:border-box;height:48px;min-height:48px;padding:6px 14px;background:#fffffff2;border-top:1px solid var(--line);z-index:2}.footer[hidden]{display:flex!important}.footer:empty:after{content:"";display:block;min-width:1px}.swipe-zone{flex:none;height:42px;min-height:42px;background:#e9edf3;border-top:1px solid #d9e0e9;border-bottom:1px solid #d9e0e9;touch-action:pan-y;user-select:none}.footer button{white-space:nowrap;border:1px solid var(--line);border-radius:20px;background:white;padding:6px 12px;cursor:pointer}.footer button.active{background:#344a68;color:white}.drawer-backdrop,.modal-backdrop{display:none;position:fixed;inset:0;background:#14203366;z-index:8}.drawer-backdrop.open,.modal-backdrop.open{display:block}.drawer{position:absolute;left:0;top:0;bottom:0;width:min(380px,92vw);background:white;padding:20px;overflow:auto}.drawer h2{font-size:16px;margin:18px 0 8px}.drawer h2:first-child{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:13px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit}.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}.colors input{height:35px;padding:2px}.btn{border:0;border-radius:7px;padding:8px 12px;cursor:pointer}.primary{background:#34577e;color:white}.neutral{background:#e9edf2;color:#25354b}.danger{background:#a93737;color:white}.modal-backdrop{z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.modal-backdrop.open{display:flex}.modal{background:white;border-radius:12px;width:min(460px,100%);padding:18px;max-height:90vh;overflow:auto}.modal h2{font-size:18px;margin:0 0 12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.routine{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:13px}.workspace-row{flex-wrap:nowrap;align-items:center;gap:5px}.workspace-row input{min-width:0;flex:1}.workspace-row .btn{flex:none;padding:6px 8px;font-size:12px;white-space:nowrap}.subtle{font-size:12px;color:var(--muted)}@media(max-width:520px){.main{padding:10px}.tabs button{font-size:13px}.grid{grid-template-columns:1fr}}
.radio-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}.radio-list label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:18px;padding:6px 10px;background:white;cursor:pointer}.radio-list input{accent-color:#34577e;margin:0}.radio-list label:has(input:checked){background:#e8eef7;border-color:#34577e;font-weight:700}
:root{--status-unworked:#8b5a9f;--status-new:#3273a8;--status-started:#b56713;--status-done:#39815a;--status-postponed:#9b6b00;--status-cancelled:#a64b4b}body{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}header,.tabs,.footer{flex:none}.tabs{position:relative;top:auto}.main{flex:1;min-height:0;overflow:auto;width:100%;overscroll-behavior:contain}.radio-list label{position:relative;color:#29364a}.radio-list input{position:absolute;opacity:0;pointer-events:none}.radio-list label:has(input[value="未実施"]:checked){background:#e8f1f8;border-color:var(--status-unworked);color:var(--status-unworked)}.radio-list label:has(input[value="未着手"]:checked){background:#e5f1fa;border-color:var(--status-new);color:var(--status-new)}.radio-list label:has(input[value="着手"]:checked){background:#fff0dc;border-color:var(--status-started);color:var(--status-started)}.radio-list label:has(input[value="完了"]:checked){background:#e6f4eb;border-color:var(--status-done);color:var(--status-done)}.radio-list label:has(input[value="延期"]:checked){background:#fff4cf;border-color:var(--status-postponed);color:var(--status-postponed)}.radio-list label:has(input[value="中止"]:checked){background:#fbe8e8;border-color:var(--status-cancelled);color:var(--status-cancelled)}.radio-list label:has(input:focus-visible){outline:2px solid #34577e;outline-offset:2px}.status-未実施{background:#e8f1f8;color:var(--status-unworked)}.status-未着手{background:#e5f1fa;color:var(--status-new)}.status-着手{background:#fff0dc;color:var(--status-started)}.status-完了{background:#e6f4eb;color:var(--status-done)}.status-延期{background:#fff4cf;color:var(--status-postponed)}.status-中止{background:#fbe8e8;color:var(--status-cancelled)}#monthly.grid.active,#todo.grid.active{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}#future.grid,#daily.grid{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}#future.grid,#daily.grid{scrollbar-width:thin;cursor:grab}#future.grid:active,#daily.grid:active{cursor:grabbing}#future.grid::-webkit-scrollbar,#daily.grid::-webkit-scrollbar{display:block;height:10px}#future.grid::-webkit-scrollbar-thumb,#daily.grid::-webkit-scrollbar-thumb{background:#aeb8c6;border-radius:8px}.future-page{flex:0 0 100%;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(180px,1fr));gap:12px;scroll-snap-align:start}.daily-page{flex:0 0 100%;min-width:0;scroll-snap-align:start}.daily-page .card{min-height:calc(100% - 4px)}.todo-dates{display:flex;flex-direction:column;gap:2px;white-space:nowrap}.todo-dates small{color:var(--status-postponed)}.details{min-height:90px;resize:vertical}
</style>
</head>
<body>
<header><button class="icon-btn" id="menu" aria-label="共通メニュー">☰</button><div class="brand"><h1>e-Bullet Journal</h1><nav id="workspaceTabs" class="workspace-tabs" aria-label="ワークスペース"></nav></div><button class="icon-btn" id="gear" aria-label="ワークスペース設定">⚙</button></header>
<nav class="tabs" id="tabs"><button data-tab="future">Future</button><button data-tab="monthly">Monthly</button><button data-tab="daily">Daily</button><button data-tab="todo">ToDo</button></nav>
<main class="main"><section id="future" class="panel grid"></section><section id="monthly" class="panel grid"></section><section id="daily" class="panel grid"></section><section id="todo" class="panel grid"></section></main>
<div class="swipe-zone" id="swipeZone" aria-hidden="true"></div><nav class="tabs bottom-tabs" id="bottomTabs" aria-label="現在の画面"><button data-tab="future">Future</button><button data-tab="monthly">Monthly</button><button data-tab="daily">Daily</button><button data-tab="todo">ToDo</button></nav><footer class="footer" id="footer"></footer>
<div class="drawer-backdrop" id="drawerBackdrop"><aside class="drawer"><h2 id="drawerTitle">共通メニュー</h2><div id="commonSettings"><h2>ワークスペース管理</h2><div id="workspaceList"></div><div class="field"><label for="newWorkspaceName">新しいタブ</label><input id="newWorkspaceName" type="text" placeholder="仕事、プライベートなど"></div><button class="btn primary" id="addWorkspace">タブを追加</button><h2>初期設定</h2><div class="field"><label for="startYm">開始年月</label><input type="month" id="startYm"></div><div class="field"><label>画面ごとの色</label><div class="colors"><label>Future <input type="color" data-color="future"></label><label>Monthly <input type="color" data-color="monthly"></label><label>Daily <input type="color" data-color="daily"></label><label>ToDo <input type="color" data-color="todo"></label></div></div>
</div><div id="workspaceSettings" hidden><h2>ルーティン</h2><input type="hidden" id="routineId"><div class="field"><label for="routineTitle">内容</label><input id="routineTitle" type="text"></div><div class="field"><label for="routineType">繰り返し</label><select id="routineType"><option value="daily">毎日</option><option value="weekly">毎週</option></select></div><div class="field" id="weekdayField" hidden><label for="weekday">曜日</label><select id="weekday"><option value="0">日曜日</option><option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="6">土曜日</option></select></div><div class="field"><label for="routineStart">開始日</label><input type="date" id="routineStart"></div><div class="field"><label for="routineEnd">終了日（未指定なら開始月末）</label><input type="date" id="routineEnd"></div><div class="actions"><button class="btn neutral" id="cancelRoutine" hidden>取消</button><button class="btn primary" id="saveRoutine">登録</button></div><div id="routines"></div>
<h2>バックアップと復元</h2><button class="btn neutral" id="export">JSONを保存</button> <button class="btn neutral" id="import">JSONを読み込む</button><input type="file" id="file" accept="application/json,.json" hidden><p class="subtle">読み込み時は現在のワークスペースのデータを置き換えます。</p><h2>データ管理</h2><button class="btn danger" id="clearWorkspaceDataBtn">このワークスペースのデータを消去</button></div><div id="commonData"><h2>データ管理</h2><button class="btn danger" id="clearData">すべてのデータをクリア</button></div><div class="actions"><button class="btn neutral" id="closeDrawer">閉じる</button></div></aside></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><h2 id="modalTitle">項目</h2><div class="field" id="todoPickerField"><label for="todoPicker">未完了ToDoをDailyに転記</label><select id="todoPicker"></select></div><div class="field"><label for="title">タイトル</label><input id="title" type="text"></div><div class="field"><label id="dateLabel" for="date">予定日</label><input id="date" type="date"></div><div class="field" id="timeField"><label for="time">予定時刻（任意）</label><input id="time" type="time"></div><div class="field" id="detailsField" hidden><label for="details">メモ</label><textarea id="details" class="details"></textarea></div><div class="field" id="statusField"><span>状態</span><div id="statusRadios" class="radio-list"><label><input type="radio" name="itemStatus" value="未実施"> 未実施</label><label><input type="radio" name="itemStatus" value="未着手"> 未着手</label><label><input type="radio" name="itemStatus" value="着手"> 着手</label><label><input type="radio" name="itemStatus" value="完了"> 完了</label><label><input type="radio" name="itemStatus" value="延期"> 延期</label><label><input type="radio" name="itemStatus" value="中止"> 中止</label></div><select id="status" hidden><option>未実施</option><option>未着手</option><option>着手</option><option>完了</option><option>延期</option><option>中止</option></select></div><div class="field" id="postponeField" hidden><label for="postpone">延期後の予定日</label><input id="postpone" type="date"></div><p class="subtle" id="modalHint"></p><div class="actions"><button class="btn neutral" id="copyToDaily" hidden>Dailyへ作成</button><button class="btn danger" id="deleteItem">削除</button><button class="btn neutral" id="cancelItem">キャンセル</button><button class="btn primary" id="saveItem">保存</button></div></div></div>
<script>
(()=>{'use strict';
const KEY='e_bullet_journal_db';const today=()=>{const d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};const ymNow=()=>today().slice(0,7);const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;
const defaults=()=>({settings:{startYm:ymNow(),colors:{future:'#e3f2fd',monthly:'#e8f5e9',daily:'#fff3e0',todo:'#f3e5f5'}},routines:[],routineSkips:[],items:[]});let workspaceStore,activeWorkspace,state;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.workspaces)){workspaceStore=saved;workspaceStore.workspaces=workspaceStore.workspaces.filter(w=>w&&w.id&&w.data);if(!workspaceStore.workspaces.length)workspaceStore.workspaces=[{id:'main',name:'メイン',data:defaults()}];workspaceStore.activeId=workspaceStore.workspaces.some(w=>w.id===workspaceStore.activeId)?workspaceStore.activeId:workspaceStore.workspaces[0].id}else{workspaceStore={activeId:'main',workspaces:[{id:'main',name:'メイン',data:saved||defaults()}]}}}catch{workspaceStore={activeId:'main',workspaces:[{id:'main',name:'メイン',data:defaults()}]}}activeWorkspace=workspaceStore.workspaces.find(w=>w.id===workspaceStore.activeId);state=activeWorkspace.data;state.settings??=defaults().settings;state.settings.colors??=defaults().settings.colors;state.routines??=[];state.routineSkips??=[];state.items??=[];workspaceStore.common??={};workspaceStore.common.startYm??=state.settings.startYm;workspaceStore.common.colors={...defaults().settings.colors,...state.settings.colors,...workspaceStore.common.colors};state.settings.startYm=workspaceStore.common.startYm;
let tab='future',selected='',editing=null,modalContext={},lastScrollTarget='',edgeNavigate=0;const $=id=>document.getElementById(id);const save=()=>{activeWorkspace.data=state;workspaceStore.activeId=activeWorkspace.id;localStorage.setItem(KEY,JSON.stringify(workspaceStore))};const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const fmt=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;const plusDay=s=>{const d=parseDate(s);d.setDate(d.getDate()+1);return fmt(d.getFullYear(),d.getMonth()+1)+'-'+String(d.getDate()).padStart(2,'0')};
function openDrawer(mode){const common=mode==='common';$('drawerTitle').textContent=common?'共通メニュー':'ワークスペース設定';$('commonSettings').hidden=!common;$('workspaceSettings').hidden=common;$('commonData').hidden=!common;$('drawerBackdrop').classList.add('open');if(common)refreshWorkspaceList();else refreshRoutineList()}function renderWorkspaceTabs(){const nav=$('workspaceTabs');nav.hidden=workspaceStore.workspaces.length<2;nav.replaceChildren();for(const w of workspaceStore.workspaces){const b=document.createElement('button');b.type='button';b.textContent=w.name;b.classList.toggle('active',w.id===activeWorkspace.id);b.onclick=()=>switchWorkspace(w.id);nav.append(b)}}
function clearWorkspaceData(w){if(!confirm(`「${w.name}」ワークスペースの予定・記録・ルーティンを消去します。この操作は取り消せません。`))return;w.data=defaults();w.data.settings.startYm=workspaceStore.common.startYm;w.data.settings.colors={...workspaceStore.common.colors};if(w.id===activeWorkspace.id){state=w.data;applySettings();render();refreshRoutineList()}save();refreshWorkspaceList()}function refreshWorkspaceList(){const box=$('workspaceList');box.replaceChildren();for(const w of workspaceStore.workspaces){const row=document.createElement('div');row.className='routine workspace-row';const name=document.createElement('input');name.type='text';name.value=w.name;name.setAttribute('aria-label','タブ名');name.style.flex='1';const rename=document.createElement('button');rename.className='btn neutral';rename.textContent='名前変更';rename.onclick=()=>{const value=name.value.trim();if(!value)return alert('タブ名を入力してください。');w.name=value;save();renderWorkspaceTabs();refreshWorkspaceList()};const del=document.createElement('button');del.className='btn danger';del.textContent='削除';del.disabled=workspaceStore.workspaces.length===1;del.onclick=()=>{if(workspaceStore.workspaces.length===1)return;if(!confirm(`「${w.name}」タブを削除しますか？中のデータも削除されます。`))return;workspaceStore.workspaces=workspaceStore.workspaces.filter(x=>x.id!==w.id);if(activeWorkspace.id===w.id){activeWorkspace=workspaceStore.workspaces[0];state=activeWorkspace.data;applySettings();selected='';lastScrollTarget='';setTab('daily')}save();renderWorkspaceTabs();refreshWorkspaceList()};row.append(name,rename,del);box.append(row)}}
function switchWorkspace(id){const next=workspaceStore.workspaces.find(w=>w.id===id);if(!next||next.id===activeWorkspace.id)return;save();activeWorkspace=next;state=activeWorkspace.data;state.settings??=defaults().settings;state.settings.startYm=workspaceStore.common.startYm;state.settings.colors??=defaults().settings.colors;state.routines??=[];state.routineSkips??=[];state.items??=[];selected='';lastScrollTarget='';renderWorkspaceTabs();applySettings();setTab('daily')}function applySettings(){state.settings.startYm=workspaceStore.common.startYm;document.documentElement.style.setProperty('--future',workspaceStore.common.colors.future);document.documentElement.style.setProperty('--monthly',workspaceStore.common.colors.monthly);document.documentElement.style.setProperty('--daily',workspaceStore.common.colors.daily);document.documentElement.style.setProperty('--todo',workspaceStore.common.colors.todo);$('startYm').value=workspaceStore.common.startYm;document.querySelectorAll('[data-color]').forEach(x=>x.value=workspaceStore.common.colors[x.dataset.color])}function setStatus(value){$('status').value=value;document.querySelectorAll('[name="itemStatus"]').forEach(r=>r.checked=r.value===value)}
function monthRange(){let [y,m]=state.settings.startYm.split('-').map(Number);const [ey,em]=ymNow().split('-').map(Number);let endM=em+1,endY=ey;if(endM===13){endM=1;endY++}if(tab==='daily'&&/^\d{4}-\d{2}$/.test(selected)){const [sy,sm]=selected.split('-').map(Number);if(sy>endY||sy===endY&&sm>=endM){endY=sy;endM=sm+1;if(endM===13){endM=1;endY++}}}const out=[];while(y<endY||y===endY&&m<=endM){out.push(fmt(y,m));if(++m===13){m=1;y++}}return out}
function years(){const start=Number(state.settings.startYm.slice(0,4)),now=Number(ymNow().slice(0,4));let end=now+1;if(tab==='future'&&/^\d{4}$/.test(selected))end=Math.max(end,Number(selected)+1);return Array.from({length:Math.max(0,end-start+1)},(_,i)=>String(start+i))}
